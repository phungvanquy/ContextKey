[package]
name = "contextkey"
version = "0.5.0"
edition = "2021"
description = "A lightweight desktop AI assistant for translation, text chat, and screenshot questions."
repository = "https://github.com/phungvanquy/ContextKey"

[[bin]]
name = "contextkey"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
arboard = "3"
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"], default-features = false }
futures-util = { version = "0.3", features = ["std"], default-features = false }
tauri-plugin-single-instance = "2"
tts = "0.26"
arc-swap = "1"
xcap = "0.9"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Native keyboard hook and WebView2 recovery UI (available without a webview).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

name: Build ContextKey (Tauri)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Keep branch and tag runs independent so a branch push cannot cancel publication.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Unit tests cover hotkey mapping, popup sizing, and saved-data migration.
      # Nothing here touches the hook itself — that needs a real desktop session,
      # see openspec/QA-CHECKLIST.md.
      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --bins

      # Publication waits for both the EXE and MSIX jobs below.
      - name: Build Tauri app (release)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: ContextKey-Windows
          path: src-tauri/target/release/contextkey.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ContextKey-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  msix:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/microsoft-store.yml

  release:
    if: github.ref_type == 'tag'
    needs: [build, msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Download tested release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ContextKey-*
          path: release-assets
          merge-multiple: true

      - name: Verify release versions and checksums
        run: python3 packaging/windows/verify_release.py

      - name: Publish complete GitHub release
        shell: bash
        run: |
          if existing_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$existing_draft" != "true" ]]; then
              echo "Refusing to replace assets of an already published release."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "ContextKey $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "ContextKey $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          # Only unpublished draft assets may be replaced when retrying a failed upload.
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContextKey — Chat</title>
  <link rel="icon" type="image/png" href="brand.png" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="window.css" />
  <link rel="stylesheet" href="chat.css" />
  <link rel="stylesheet" href="vendor/katex.css" />
  <link rel="stylesheet" href="markdown.css" />
</head>
<body>
  <script src="icons.js"></script>
  <div class="chat-window floating-window">
    <!-- Header: the ONLY draggable zone -->
    <div class="header" data-tauri-drag-region>
      <span class="header-title" id="header-title" data-tauri-drag-region>
        <span class="window-mark window-brand" aria-hidden="true"><img class="brand-logo" src="brand.png" alt="" width="30" height="30" /></span>
        <span class="header-copy" data-tauri-drag-region><span id="header-label" data-tauri-drag-region>Chat</span><span class="header-subtitle" data-tauri-drag-region>ContextKey</span></span>
      </span>
      <button class="btn-quiet" id="new-chat-btn" title="Start a new conversation"><svg class="ic" aria-hidden="true"><use href="#ic-plus"/></svg>New chat</button>
      <button class="close-btn" id="close-btn" title="Close (Esc)" aria-label="Close">
        <svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg>
      </button>
    </div>

    <!-- Context strip (hidden in free-chat mode) -->
    <div class="context-strip" id="context-strip">
      <svg class="ic context-icon" aria-hidden="true"><use href="#ic-text"/></svg>
      <details class="context-details">
        <summary class="context-text" id="context-text"></summary>
        <div class="context-full" id="context-full"></div>
      </details>
      <button class="context-clear" id="context-clear" title="Clear context and start a new chat" aria-label="Clear context and start a new chat">
        <svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg>
      </button>
    </div>

    <div class="selection-notice" id="selection-notice" hidden>
      <span>A new text selection is ready.</span>
      <button class="btn-quiet" id="use-selection-btn">New chat with selection</button>
      <button class="context-clear" id="dismiss-selection-btn" aria-label="Dismiss new selection">
        <svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg>
      </button>
    </div>

    <div class="conversation-area">
      <div class="transcript" id="transcript" role="log" aria-label="Conversation" aria-live="polite" tabindex="0">
        <div class="empty-state" id="empty-state">
          <div class="empty-illustration" aria-hidden="true">
            <span class="orbit-icon orbit-text"><svg class="ic"><use href="#ic-languages"/></svg></span>
            <span class="empty-mark"><img class="brand-logo" src="brand.png" alt="" width="64" height="64" /></span>
            <span class="orbit-icon orbit-chat"><svg class="ic"><use href="#ic-chat"/></svg></span>
          </div>
          <span class="empty-eyebrow">A little clarity, on demand</span>
          <p class="empty-title" id="empty-title">Start a conversation</p>
          <p id="empty-description">Type a question below. Shift+Enter adds a new line.</p>
        </div>
      </div>
      <button class="jump-latest" id="jump-latest" hidden>Jump to latest ↓</button>
    </div>

    <div class="image-strip" id="image-strip" aria-label="Screenshots to send" hidden></div>
    <p class="chat-status" id="chat-status" role="status"></p>

    <!-- Input bar pinned to bottom -->
    <div class="composer">
      <div class="input-bar">
        <textarea
          class="chat-input"
          id="chat-input"
          rows="1"
          placeholder="What would you like to understand?"
          autocomplete="off"
          spellcheck="false"
          aria-label="Message"
          aria-describedby="input-help"
        ></textarea>
        <button class="btn-send" id="send-btn" title="Send message (Enter)" disabled><span>Send</span><svg class="ic" aria-hidden="true"><use href="#ic-arrow-up"/></svg></button>
      </div>
      <p class="composer-hint" id="input-help"><span><kbd>Enter</kbd> to send</span><span><kbd>Shift + Enter</kbd> for a new line</span></p>
    </div>
  </div>

  <dialog class="chat-dialog" id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
    <h2 id="reset-title">Start a new chat?</h2>
    <p id="reset-description">This clears the current conversation and screenshots.</p>
    <div class="dialog-actions">
      <button class="btn-quiet" id="cancel-reset-btn" autofocus>Keep current chat</button>
      <button class="btn-send" id="confirm-reset-btn">Start new chat</button>
    </div>
  </dialog>

  <dialog class="chat-dialog image-dialog" id="image-dialog" aria-labelledby="image-dialog-title">
    <div class="dialog-header">
      <h2 id="image-dialog-title">Screenshot preview</h2>
      <button class="close-btn" id="close-image-btn" aria-label="Close screenshot preview" autofocus>
        <svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg>
      </button>
    </div>
    <div class="image-preview" id="image-preview"><img id="preview-image" alt="Screenshot preview" /></div>
    <button class="btn-quiet" id="image-size-btn" aria-pressed="false">Show actual size</button>
  </dialog>

  <script src="vendor/markdown-libs.js"></script>
  <script src="markdown.js"></script>
  <script src="chat.js"></script>
</body>
</html>
